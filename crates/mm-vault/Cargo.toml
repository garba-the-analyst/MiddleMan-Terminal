[package]
name = "mm-vault"
version = "2.4.0"
edition = "2021"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = { workspace = true }
