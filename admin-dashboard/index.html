<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiddleMan Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mmBlack: '#0a0a0c', // Deep glossy black
              mmSilver: '#C0C0C0', // Metallic silver
              mmSilverDark: '#6b6b6b'
            },
            backgroundImage: {
              // Glossy black base with a sharp ~10% silver gradient sweep at the bottom right
              'glossy-gradient': 'linear-gradient(135deg, #0a0a0c 85%, #2a2a2c 100%)',
              'card-gradient': 'linear-gradient(145deg, #121214 0%, #0a0a0c 100%)'
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-mmBlack bg-glossy-gradient min-h-screen text-white antialiased selection:bg-mmSilver selection:text-black">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
