[workspace]
resolver = "2"
members = [
    "crates/mm-api",
    "crates/mm-core",
    "crates/mm-db",
    "crates/mm-vault",
    "crates/mm-crypto",
    "crates/mm-fiat",
    "crates/mm-ai",
    "crates/mm-notifications"
]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "rust_decimal", "macros", "migrate", "json"] }
thiserror = "1.0"
once_cell = "1"
regex = "1"
bs58 = "0.5"
hex = "0.4"
rand = "0.8"
