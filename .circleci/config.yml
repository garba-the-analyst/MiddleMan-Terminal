version: "2.1"
jobs:
  build:
    docker:
      - image: cimg/rust:1.85.0
    steps:
      - checkout
      - run: { name: "Rust tests", command: cargo test --all -- --nocapture }
      - run: { name: "Dashboard build", command: npm --prefix apps/admin-dashboard ci && npm --prefix apps/admin-dashboard run build }

workflows:
  build:
    jobs: [build]
